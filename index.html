<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surxondaryo Uy Ijara</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f4f9; color: #333; }
    .card { background: #fff; padding: 15px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .btn { background: #2481cc; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; }
    input, select, textarea { width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    .badge { background: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>

  <h2>🏠 Surxondaryo Uy Ijara</h2>
  
  <!-- E'lon joylash formasi -->
  <div class="card">
    <h3>Yangi e'lon qo'shish</h3>
    <input type="text" id="title" placeholder="Sarlavha (masalan: 2 xonali kvartira)">
    <input type="number" id="price" placeholder="Narxi ($ yoki SO'M)">
    <input type="text" id="phone" placeholder="Telefon raqam">
    <textarea id="desc" placeholder="Tavsif (tuman, qavat, sharoitlar)"></textarea>
    <button class="btn" onclick="addListing()">E'lonni yuborish</button>
  </div>

  <!-- E'lonlar ro'yxati -->
  <h3>Mavjud E'lonlar</h3>
  <div id="listings"></div>

  <script>
    // 1. FIREBASE SOZLAMALARI (O'zingizning kalitlaringizni qo'ying)
    const firebaseConfig = {
      apiKey: "AIzaSyClO-_iXU-eJWOHB3bzcuAdn7UqHk71oUI",
  authDomain: "surhondaryo-uy-ijara.firebaseapp.com",
  projectId: "surhondaryo-uy-ijara",
  storageBucket: "surhondaryo-uy-ijara.firebasestorage.app",
  messagingSenderId: "551178863813",
  appId: "1:551178863813:web:16daab123488a8d4325cac",
  measurementId: "G-4SJC1H62SK"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Telegram WebApp obyektini faollashtirish
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    // 2. E'LON QO'SHISH VA MODERATSIYAGA YUBORISH
    function addListing() {
      const title = document.getElementById('title').value;
      const price = document.getElementById('price').value;
      const phone = document.getElementById('phone').value;
      const desc = document.getElementById('desc').value;

      if (!title || !price || !phone) {
        alert("Iltimos, barcha maydonlarni to'ldiring!");
        return;
      }

      // Bazaga status: "pending" (moderatsiya kutilmoqda) qilib saqlaymiz
      const newRef = db.ref('listings').push();
      newRef.set({
        title: title,
        price: price,
        phone: phone,
        desc: desc,
        status: 'pending',
        createdAt: Date.now()
      }).then(() => {
        alert("E'loningiz moderator ko'rib chiqishi uchun yuborildi!");
        document.getElementById('title').value = '';
        document.getElementById('price').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('desc').value = '';
      });
    }

    // 3. FAQAT TASDIQLANGAN (APPROVED) E'LONLARNI KO'RSATISH
    db.ref('listings').on('value', (snapshot) => {
      const container = document.getElementById('listings');
      container.innerHTML = '';
      const data = snapshot.val();
      
      for (let id in data) {
        const item = data[id];
        if (item.status === 'approved') {
          container.innerHTML += `
            <div class="card">
              <span class="badge">Tasdiqlangan</span>
              <h4>${item.title} - ${item.price}</h4>
              <p>${item.desc}</p>
              <p><b>Tel:</b> ${item.phone}</p>
            </div>
          `;
        }
      }
    });
  </script>
</body>
</html>
