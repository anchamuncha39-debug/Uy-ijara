<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surxondaryo Uy Ijara</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { --main: #0088cc; --bg: #f4f7f6; --white: #fff; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 12px; color: #333; }
    .card { background: var(--white); border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    h2, h3 { color: var(--main); margin-top: 0; }
    input, select, textarea, button { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
    button { background: var(--main); color: var(--white); border: none; font-weight: bold; cursor: pointer; }
    .badge-vip { background: #ff9800; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; float: right; font-weight: bold; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .hidden { display: none; }
    .tab-btn { flex: 1; padding: 10px; background: #ddd; border: none; font-weight: bold; }
    .tab-btn.active { background: var(--main); color: #fff; }
  </style>
</head>
<body>

  <div style="display: flex; margin-bottom: 15px; border-radius: 8px; overflow: hidden;">
    <button class="tab-btn active" onclick="showTab('list')">🏠 E'lonlar</button>
    <button class="tab-btn" onclick="showTab('add')">➕ E'lon Berish</button>
  </div>

  <!-- 1-BO'LIM: E'LONLAR RO'YXATI VA FILTR -->
  <div id="tab-list">
    <div class="card">
      <h3>🔍 Qidiruv va Filtr</h3>
      <div class="grid">
        <select id="filter-region">
          <option value="all">Barcha Tumanlar</option>
          <option value="Termiz sh.">Termiz sh.</option>
          <option value="Denov">Denov</option>
          <option value="Sherobod">Sherobod</option>
          <option value="Jarqo'rg'on">Jarqo'rg'on</option>
          <option value="Sho'rchi">Sho'rchi</option>
          <option value="Kumqo'rg'on">Kumqo'rg'on</option>
        </select>
        <select id="filter-type">
          <option value="all">Barcha Turlar</option>
          <option value="Kvartira">Kvartira</option>
          <option value="Hovli">Hovli</option>
          <option value="Ofis/Dukon">Ofis / Do'kon</option>
        </select>
      </div>
      <button onclick="applyFilter()">Filtrlash</button>
    </div>

    <div id="listings-container">
      <p style="text-align: center;">E'lonlar yuklanmoqda...</p>
    </div>
  </div>

  <!-- 2-BO'LIM: E'LON QO'SHISH -->
  <div id="tab-add" class="hidden">
    <div class="card">
      <h3>✍️ Yangi E'lon Joylash</h3>
      <input type="text" id="title" placeholder="E'lon sarlavhasi (masalan: 2 xonali kvartira)">
      <div class="grid">
        <select id="region">
          <option value="Termiz sh.">Termiz sh.</option>
          <option value="Denov">Denov</option>
          <option value="Sherobod">Sherobod</option>
          <option value="Jarqo'rg'on">Jarqo'rg'on</option>
          <option value="Sho'rchi">Sho'rchi</option>
        </select>
        <select id="type">
          <option value="Kvartira">Kvartira</option>
          <option value="Hovli">Hovli</option>
          <option value="Ofis/Dukon">Ofis/Do'kon</option>
        </select>
      </div>
      <div class="grid">
        <input type="number" id="price" placeholder="Narxi ($)">
        <input type="text" id="phone" placeholder="Telefon raqam">
      </div>
      <textarea id="desc" rows="3" placeholder="Uy haqida batafsil (qavat, sharoitlar...)"></textarea>
      
      <label><b>📷 Rasm havolasi (URL):</b></label>
      <input type="text" id="img-url" placeholder="https:// ... rasm havolasi">

      <hr style="margin: 15px 0;">
      <label><b>⭐ VIP Xizmat (Ixtiyoriy):</b></label>
      <select id="is-vip" onchange="toggleVipInfo()">
        <option value="false">Oddiy e'lon (Bepul)</option>
        <option value="true">VIP E'lon — Topda turadi (10,000 so'm)</option>
      </select>

      <div id="vip-payment-info" class="hidden" style="background: #fff9c4; padding: 10px; border-radius: 8px;">
        <p style="margin:0; font-size:12px;">Karta: <b>4790 9200 1820 7154</b> (Eski egalari)</p>
        <p style="margin:5px 0 0 0; font-size:11px; color:#d32f2f;">To'lov qilgach, chek rasmini telegram administratsiyaga yuborasiz.</p>
      </div>

      <button onclick="submitListing()" style="margin-top: 15px;">🚀 E'lonni Yuborish</button>
    </div>
  </div>

  <script>
    // FIREBASE KALITLARINGIZNI SHU YERGA QO'YING
    const firebaseConfig = {
      apiKey: "AIzaSyClO-_iXU-eJWOHB3bzcuAdn7UqHk71oUI",
  authDomain: "surhondaryo-uy-ijara.firebaseapp.com",
  projectId: "surhondaryo-uy-ijara",
  storageBucket: "surhondaryo-uy-ijara.firebasestorage.app",
  messagingSenderId: "551178863813",
  appId: "1:551178863813:web:16daab123488a8d4325cac",
  measurementId: "G-4SJC1H62SK"
};

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const tg = window.Telegram?.WebApp;
    if(tg) tg.expand();

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if(tab === 'list') {
        document.getElementById('tab-list').classList.remove('hidden');
        document.getElementById('tab-add').classList.add('hidden');
        event.target.classList.add('active');
      } else {
        document.getElementById('tab-list').classList.add('hidden');
        document.getElementById('tab-add').classList.remove('hidden');
        event.target.classList.add('active');
      }
    }

    function toggleVipInfo() {
      const isVip = document.getElementById('is-vip').value === 'true';
      document.getElementById('vip-payment-info').classList.toggle('hidden', !isVip);
    }

    // E'lonni bazaga yuborish
    function submitListing() {
      const title = document.getElementById('title').value;
      const region = document.getElementById('region').value;
      const type = document.getElementById('type').value;
      const price = document.getElementById('price').value;
      const phone = document.getElementById('phone').value;
      const desc = document.getElementById('desc').value;
      const img = document.getElementById('img-url').value || 'https://via.placeholder.com/300x180?text=Rasm+Yo%27q';
      const isVip = document.getElementById('is-vip').value === 'true';

      if (!title || !price || !phone) {
        alert("Iltimos, asosiy maydonlarni to'ldiring!");
        return;
      }

      const newRef = db.ref('listings').push();
      newRef.set({
        title, region, type, price, phone, desc, img, isVip,
        status: 'pending',
        createdAt: Date.now(),
        userId: tg?.initDataUnsafe?.user?.id || 'anonim'
      }).then(() => {
        alert("E'loningiz moderatsiyaga yuborildi! Administrator tasdiqlagach kanalda hamda ilovada ko'rinadi.");
        showTab('list');
      });
    }

    // E'lonlarni yuklab ko'rsatish
    function loadListings(regionFilter = 'all', typeFilter = 'all') {
      db.ref('listings').on('value', snapshot => {
        const container = document.getElementById('listings-container');
        container.innerHTML = '';
        const data = snapshot.val();

        if (!data) {
          container.innerHTML = '<p style="text-align:center;">Hozircha e'lonlar yo'q.</p>';
          return;
        }

        Object.keys(data).reverse().forEach(key => {
          const item = data[key];
          // Faqat tasdiqlangan (approved) e'lonlarni ko'rsatamiz
          if (item.status === 'approved') {
            if (regionFilter !== 'all' && item.region !== regionFilter) return;
            if (typeFilter !== 'all' && item.type !== typeFilter) return;

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
              ${item.isVip ? '<span class="badge-vip">⭐ VIP</span>' : ''}
              <img src="${item.img}" style="width:100%; height:180px; object-fit:cover; border-radius:8px; margin-bottom:8px;">
              <h3 style="margin: 4px 0;">${item.title}</h3>
              <p style="margin:4px 0; color:#666; font-size:13px;">📍 ${item.region} | 🏠 ${item.type}</p>
              <p style="margin:4px 0; color:#2e7d32; font-weight:bold; font-size:16px;">💵 ${item.price} $</p>
              <p style="font-size:13px; color:#444;">${item.desc}</p>
              <a href="tel:${item.phone}"><button style="background:#4caf50;">📞 Qo'ng'iroq qilish</button></a>
            `;
            container.appendChild(card);
          }
        });
      });
    }

    function applyFilter() {
      const r = document.getElementById('filter-region').value;
      const t = document.getElementById('filter-type').value;
      loadListings(r, t);
    }

    loadListings();
  </script>
</body>
</html>
